<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Danh sách sản phẩm</title>
        <style>
            body {
                margin: 0;
                padding: 32px 16px;
                color: #263642;
                background: #f3f6f4;
                font-family: "Segoe UI", Tahoma, sans-serif;
            }

            main {
                max-width: 760px;
                margin: 0 auto;
            }

            h1 {
                color: #22594e;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                background: #fff;
            }

            th,
            td {
                padding: 12px 14px;
                border: 1px solid #cbd7d1;
                text-align: left;
            }

            th {
                color: #fff;
                background: #22594e;
            }

            tbody tr:nth-child(even) {
                background: #edf4ef;
            }

            td:nth-child(2),
            td:nth-child(3) {
                text-align: right;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Danh sách sản phẩm</h1>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Tên sản phẩm</th>
                        <th scope="col">Giá</th>
                        <th scope="col">Số lượng</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Bàn phím cơ</td>
                        <td>850.000 VNĐ</td>
                        <td>12</td>
                    </tr>
                    <tr>
                        <td>Chuột không dây</td>
                        <td>420.000 VNĐ</td>
                        <td>25</td>
                    </tr>
                    <tr>
                        <td>Tai nghe</td>
                        <td>1.200.000 VNĐ</td>
                        <td>8</td>
                    </tr>
                    <tr>
                        <td>Màn hình 24 inch</td>
                        <td>3.450.000 VNĐ</td>
                        <td>6</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
